name: Sync & Build Safari Extension

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream release tag (leave empty for latest upstream release)'
        required: false
        type: string
        default: ''
      force_build:
        description: 'Force build and overwrite even if release already exists in this repo'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync-and-build:
    name: Sync Safari Release & Build Xcode Extension
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check upstream release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: ajayyy/SponsorBlock
          TARGET_TAG: ${{ inputs.upstream_tag }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          set -euo pipefail

          if [ -z "$TARGET_TAG" ]; then
            echo "Querying latest release from $UPSTREAM_REPO..."
            TARGET_TAG=$(gh release view --repo "$UPSTREAM_REPO" --json tagName -q .tagName)
          fi

          echo "Target tag: $TARGET_TAG"
          echo "tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"

          RELEASE_TITLE=$(gh release view "$TARGET_TAG" --repo "$UPSTREAM_REPO" --json name -q .name 2>/dev/null || echo "SponsorBlock $TARGET_TAG")
          if [ -z "$RELEASE_TITLE" ] || [ "$RELEASE_TITLE" = "null" ]; then
            RELEASE_TITLE="SponsorBlock $TARGET_TAG"
          fi
          echo "title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

          EXISTS="false"
          if gh release view "$TARGET_TAG" --json tagName -q .tagName 2>/dev/null; then
            EXISTS="true"
          fi

          if [ "$EXISTS" = "true" ] && [ "$FORCE_BUILD" != "true" ]; then
            echo "Release $TARGET_TAG already exists in this repo. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download upstream SafariExtension.zip
        if: steps.check.outputs.skip == 'false'
        id: download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: ajayyy/SponsorBlock
          TARGET_TAG: ${{ steps.check.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p ./build-assets

          echo "Attempting to download SafariExtension.zip from $UPSTREAM_REPO@$TARGET_TAG..."
          if gh release download "$TARGET_TAG" --repo "$UPSTREAM_REPO" --pattern "SafariExtension.zip" --dir ./build-assets; then
            echo "Successfully downloaded SafariExtension.zip from release."
          else
            echo "SafariExtension.zip not attached. Building from source tag..."
            mkdir -p ./upstream-src
            git clone --depth 1 --branch "$TARGET_TAG" "https://github.com/$UPSTREAM_REPO.git" ./upstream-src || git clone --depth 1 "https://github.com/$UPSTREAM_REPO.git" ./upstream-src
            cd ./upstream-src
            cp config.json.example config.json
            npm ci
            npm run build:safari
            cd ..
            (cd ./upstream-src/dist && zip -r ../../build-assets/SafariExtension.zip *)
          fi

      - name: Build Safari Extension with Xcode
        if: steps.check.outputs.skip == 'false'
        env:
          TEAM_ID: ${{ vars.DEVELOPMENT_TEAM || 'D9A6A3ZA4X' }}
          ARCHS: "x86_64 arm64"
          ONLY_ACTIVE_ARCH: "NO"
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.app
          ./ci/build-safari.sh \
            --zip ./build-assets/SafariExtension.zip \
            --output-dir ./dist-safari \
            --team-id "$TEAM_ID"

      - name: Upload artifacts to GitHub Action run
        if: steps.check.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: sponsorblock-safari-${{ steps.check.outputs.tag }}
          path: ./dist-safari/*
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: ajayyy/SponsorBlock
          TARGET_TAG: ${{ steps.check.outputs.tag }}
          RELEASE_TITLE: ${{ steps.check.outputs.title }}
        run: |
          set -euo pipefail

          UPSTREAM_BODY=$(gh release view "$TARGET_TAG" --repo "$UPSTREAM_REPO" --json body -q .body 2>/dev/null || echo "")

          cat <<-EOF > release_notes.md
          Automated Safari extension build synced from upstream [$UPSTREAM_REPO $TARGET_TAG](https://github.com/$UPSTREAM_REPO/releases/tag/$TARGET_TAG).

          ### Upstream Release Notes:
          $UPSTREAM_BODY
          EOF

          if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            echo "Updating existing release $TARGET_TAG with new assets..."
            gh release upload "$TARGET_TAG" ./dist-safari/* --clobber
          else
            echo "Creating new release $TARGET_TAG..."
            gh release create "$TARGET_TAG" ./dist-safari/* \
              --title "$RELEASE_TITLE" \
              --notes-file release_notes.md
          fi
